name: Conferir fontes jurídicas (sem publicação)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-legal-sources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fontes-juridicas-para-conferencia
          path: legal-source-check/
          retention-days: 30

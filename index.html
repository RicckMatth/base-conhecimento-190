<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Base 190 + Cérebro IA | Inteligência e Conhecimento Operacional COPOM</title>
<style>
:root {
  --bg: #f3f6fc;
  --panel: #ffffff;
  --panel-alt: #f8faff;
  --ink: #0f1d3a;
  --muted: #64748b;
  --line: #e2e8f0;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --soft: #eff4ff;
  --shadow: 0 14px 40px rgba(15, 29, 58, 0.055);
  --nav: #0b1528;
  --nav-hover: #172645;
  --good: #10b981;
  --warn: #f59e0b;
  --high: #f97316;
  --crit: #ef4444;
  --ai-grad: linear-gradient(135deg, #1e1b4b 0%, #1d4ed8 58%, #2563eb 100%);
  --scroll-track: transparent;
  --scroll-thumb: rgba(100, 116, 139, 0.28);
  --scroll-thumb-hover: rgba(37, 99, 235, 0.6);
}

.dark {
  --bg: #0b1120;
  --panel: #131c31;
  --panel-alt: #18243d;
  --ink: #f1f5f9;
  --muted: #94a3b8;
  --line: #23324d;
  --accent: #3b82f6;
  --accent-hover: #60a5fa;
  --soft: #1e2f52;
  --shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
  --nav: #070c17;
  --nav-hover: #13203a;
  --scroll-thumb: rgba(148, 163, 184, 0.24);
  --scroll-thumb-hover: rgba(59, 130, 246, 0.65);
}

/* === ESTILIZAÇÃO MODERNA DE BARRAS DE OVERFLOW (SCROLLBARS) === */
* {
  box-sizing: border-box;
  scrollbar-width: thin;
  scrollbar-color: var(--scroll-thumb) var(--scroll-track);
}

::-webkit-scrollbar {
  width: 9px;
  height: 9px;
}

::-webkit-scrollbar-track {
  background: var(--scroll-track);
  border-radius: 999px;
}

::-webkit-scrollbar-thumb {
  background: var(--scroll-thumb);
  border-radius: 999px;
  border: 2px solid transparent;
  background-clip: padding-box;
  transition: background-color 0.2s ease;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--scroll-thumb-hover);
  border: 2px solid transparent;
  background-clip: padding-box;
}

::-webkit-scrollbar-corner {
  background: transparent;
}

/* Scrollbars ultrafinas para containers internos */
.sidebar::-webkit-scrollbar,
.modal-body::-webkit-scrollbar,
.cmd-list::-webkit-scrollbar,
.chat-messages::-webkit-scrollbar,
.editor::-webkit-scrollbar,
.dispatch-box textarea::-webkit-scrollbar,
textarea::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

.sidebar {
  scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
}

.sidebar::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid transparent;
  background-clip: padding-box;
}

.sidebar::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.35);
}

html { scroll-behavior: smooth; }
body {
  margin: 0;
  font: 14px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--ink);
  background: var(--bg);
  overflow-x: hidden;
}

button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.hidden { display: none !important; }

mark {
  background: rgba(245, 158, 11, 0.28);
  color: inherit;
  padding: 1px 4px;
  border-radius: 4px;
  font-weight: 700;
}

/* === LAYOUT PRINCIPAL === */
.app {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 274px minmax(0, 1fr);
}

.sidebar {
  background: var(--nav);
  color: #d7e1fb;
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
  border-right: 1px solid rgba(255, 255, 255, 0.06);
  user-select: none;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 10px 22px;
  color: #fff;
}

.brand-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: linear-gradient(145deg, #3b82f6, #1d4ed8);
  display: grid;
  place-items: center;
  font-size: 18px;
  font-weight: 900;
  box-shadow: 0 8px 20px rgba(29, 78, 216, 0.45);
  flex-shrink: 0;
}

.brand b { font-size: 18px; letter-spacing: -0.5px; display: block; }
.brand small { display: block; font-size: 10px; color: #8ba0c7; letter-spacing: 1.4px; font-weight: 700; }

.side-label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.4px;
  color: #64789e;
  margin: 16px 12px 6px;
  text-transform: uppercase;
}

.nav-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  border: 0;
  background: transparent;
  color: #a9bbd9;
  border-radius: 10px;
  text-align: left;
  padding: 10px 12px;
  margin: 2px 0;
  transition: all 0.16s ease;
  font-weight: 500;
}

.nav-btn-left {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}

.nav-btn:hover { background: var(--nav-hover); color: #fff; }
.nav-btn.active {
  background: linear-gradient(90deg, #2563eb, #1d4ed8);
  color: #fff;
  font-weight: 650;
  box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
}

.nav-btn.ai-highlight {
  border: 1px solid rgba(96, 165, 250, 0.28);
  background: rgba(37, 99, 235, 0.12);
  color: #e2e8f0;
}
.nav-btn.ai-highlight.active {
  background: var(--ai-grad);
  border-color: transparent;
  color: #fff;
}

.nav-btn .glyph { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
.nav-count {
  font-size: 11px;
  background: rgba(255, 255, 255, 0.08);
  color: #cbd5e1;
  padding: 2px 7px;
  border-radius: 99px;
  font-weight: 700;
}
.nav-btn.active .nav-count { background: rgba(255, 255, 255, 0.22); color: #fff; }

.side-bottom {
  margin-top: auto;
  padding: 14px 8px 0;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.side-user {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 6px 4px 10px;
}

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: linear-gradient(145deg, #dbeafe, #93c5fd);
  display: grid;
  place-items: center;
  color: #1e3a8a;
  font-weight: 800;
  flex-shrink: 0;
  font-size: 13px;
}

.side-user b {
  color: #fff;
  display: block;
  max-width: 145px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 13px;
}

.side-user small { color: #8ba0c7; font-size: 11px; }

/* === TOPBAR === */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 72px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 15;
}

.breadcrumb { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.breadcrumb strong { color: var(--ink); font-weight: 700; }

.top-actions { display: flex; gap: 10px; align-items: center; }

.cmd-trigger {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  background: var(--panel-alt);
  border: 1px solid var(--line);
  color: var(--muted);
  padding: 8px 13px;
  border-radius: 10px;
  font-size: 12px;
  transition: 0.15s;
}
.cmd-trigger:hover { border-color: var(--accent); color: var(--ink); }
.kbd {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 2px 6px;
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
}

.pill {
  border: 1px solid var(--line);
  background: var(--panel-alt);
  padding: 7px 12px;
  border-radius: 100px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pill-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; }

/* === BOTÕES === */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid transparent;
  background: var(--accent);
  color: #fff;
  padding: 10px 16px;
  border-radius: 10px;
  font-weight: 650;
  font-size: 13px;
  transition: all 0.15s ease;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { background: var(--accent-hover); transform: translateY(-1px); text-decoration: none; }
.btn.secondary { background: var(--panel); border-color: var(--line); color: var(--ink); }
.btn.secondary:hover { border-color: var(--accent); background: var(--panel-alt); }
.btn.ghost { background: var(--soft); color: var(--accent); }
.btn.ghost:hover { filter: brightness(0.96); }
.btn.danger { background: rgba(239, 68, 68, 0.12); color: #ef4444; border-color: rgba(239, 68, 68, 0.25); }
.btn.danger:hover { background: #ef4444; color: #fff; }
.btn.small { padding: 7px 11px; font-size: 12px; border-radius: 8px; }

/* === CONTAINER E HERO === */
.container { max-width: 1360px; width: 100%; margin: 0 auto; padding: 28px 32px 70px; }

.hero {
  background: linear-gradient(118deg, #0c1938 0%, #1d3b8b 58%, #2563eb 100%);
  border-radius: 20px;
  color: white;
  padding: 36px 40px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 18px 42px rgba(29, 59, 139, 0.22);
}
.hero::after {
  content: "190";
  font-size: 190px;
  font-weight: 900;
  letter-spacing: -10px;
  position: absolute;
  right: 25px;
  bottom: -45px;
  opacity: 0.08;
  pointer-events: none;
}

.eyebrow { text-transform: uppercase; letter-spacing: 1.8px; font-size: 11px; font-weight: 800; opacity: 0.85; }
.hero h1 { font-size: clamp(24px, 3vw, 36px); letter-spacing: -1px; line-height: 1.18; margin: 10px 0; }
.hero p { color: #dbeafe; max-width: 680px; font-size: 14px; margin: 0; }

.hero-search {
  margin-top: 22px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: #ffffff;
  border-radius: 13px;
  padding: 6px 7px 6px 16px;
  max-width: 820px;
  box-shadow: 0 12px 30px rgba(7, 15, 40, 0.28);
}
.hero-search input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  padding: 10px 0;
  color: #0f1d3a;
  background: transparent;
  font-size: 14px;
}
.hero-search span { color: #64748b; font-size: 18px; }
.hero-search button {
  border: 0;
  background: var(--ai-grad);
  color: white;
  border-radius: 9px;
  padding: 11px 20px;
  font-weight: 700;
}
.hero-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  align-items: center;
  margin-top: 14px;
  font-size: 12px;
  color: #cbd5e1;
}
.hero-tag {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.18);
  color: #fff;
  border-radius: 99px;
  padding: 4px 11px;
  font-size: 11px;
  cursor: pointer;
  transition: 0.15s;
}
.hero-tag:hover { background: rgba(255, 255, 255, 0.25); }

/* === DIAGNÓSTICO DO CÉREBRO 190 (RESPOSTA INSTANTÂNEA) === */
.brain-diagnosis {
  margin-top: 20px;
  background: var(--panel);
  border: 2px solid var(--accent);
  border-radius: 18px;
  padding: 22px 24px;
  box-shadow: 0 18px 45px rgba(37, 99, 235, 0.14);
  position: relative;
}
.brain-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.brain-badge {
  background: var(--ai-grad);
  color: #fff;
  padding: 5px 12px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.6px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.nature-suggestion-box {
  background: var(--soft);
  border-left: 5px solid var(--accent);
  padding: 16px 18px;
  border-radius: 0 12px 12px 0;
  margin: 14px 0;
}
.nature-suggestion-box small {
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent);
  display: block;
  margin-bottom: 4px;
}
.nature-suggestion-box h2 {
  margin: 0;
  font-size: 20px;
  letter-spacing: -0.4px;
  color: var(--ink);
  line-height: 1.3;
}
.context-pills { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0; }
.context-pill {
  background: var(--panel-alt);
  border: 1px solid var(--line);
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 650;
}

/* === CHATBOT COPOM IA === */
.chat-shell {
  display: grid;
  grid-template-columns: 1fr 350px;
  gap: 18px;
  align-items: start;
}
.chat-window {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  height: 75vh;
  min-height: 550px;
  overflow: hidden;
}
.chat-top {
  padding: 16px 22px;
  background: var(--ai-grad);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.chat-messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  background: var(--bg);
}
.msg { max-width: 90%; padding: 14px 18px; border-radius: 16px; line-height: 1.6; font-size: 13.5px; }
.msg.user {
  align-self: flex-end;
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg.bot {
  align-self: flex-start;
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--line);
  border-bottom-left-radius: 4px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.04);
  width: 100%;
}
.chat-input-bar {
  padding: 14px 18px;
  background: var(--panel);
  border-top: 1px solid var(--line);
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
.chat-input-bar textarea {
  flex: 1;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 11px 14px;
  background: var(--panel-alt);
  color: var(--ink);
  resize: none;
  outline: none;
  max-height: 120px;
}
.chat-input-bar textarea:focus { border-color: var(--accent); background: var(--panel); }

/* === CARDS E GRIDS === */
.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin: 28px 0 14px;
  flex-wrap: wrap;
}
.section-head h2 { font-size: 18px; letter-spacing: -0.4px; margin: 0; }
.section-head p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-top: 20px;
}
.stat, .panel {
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  border-radius: 15px;
}
.stat { padding: 18px 20px; position: relative; }
.stat .num { font-size: 26px; font-weight: 850; letter-spacing: -0.8px; }
.stat .stat-label { color: var(--muted); font-size: 12px; font-weight: 500; }
.stat .stat-icon {
  float: right;
  background: var(--soft);
  color: var(--accent);
  border-radius: 10px;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  font-size: 17px;
}

.category-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.cat-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  cursor: pointer;
  text-align: left;
  transition: all 0.18s ease;
  display: flex;
  align-items: center;
  gap: 15px;
}
.cat-card:hover, .article-card:hover, .result:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(37, 99, 235, 0.1);
}
.cat-icon {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: var(--soft);
  display: grid;
  place-items: center;
  font-size: 22px;
  flex-shrink: 0;
}
.cat-card b { display: block; font-size: 14px; margin-bottom: 2px; }
.cat-card small { color: var(--muted); font-size: 12px; }

.article-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
.article-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.18s ease;
  min-height: 220px;
  display: flex;
  flex-direction: column;
}
.article-card h3 { font-size: 16px; line-height: 1.35; margin: 12px 0 8px; }
.article-card p {
  font-size: 12.5px;
  color: var(--muted);
  margin: 0 0 16px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.article-card footer {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-size: 11.5px;
  gap: 8px;
}

/* === BADGES & PRIORIDADES OPERACIONAIS === */
.code {
  font-size: 11px;
  font-weight: 800;
  background: var(--soft);
  color: var(--accent);
  border-radius: 6px;
  padding: 4px 8px;
  display: inline-block;
  letter-spacing: 0.3px;
}

.prio-badge {
  font-size: 10.5px;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 99px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.prio-Crítica { background: rgba(239, 68, 68, 0.14); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
.prio-Alta { background: rgba(249, 115, 22, 0.14); color: #f97316; border: 1px solid rgba(249, 115, 22, 0.3); }
.prio-Média { background: rgba(245, 158, 11, 0.14); color: #d97706; border: 1px solid rgba(245, 158, 11, 0.3); }
.prio-Baixa { background: rgba(16, 185, 129, 0.14); color: #059669; border: 1px solid rgba(16, 185, 129, 0.3); }

.badge {
  background: rgba(16, 185, 129, 0.14);
  color: #059669;
  padding: 5px 10px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 700;
}

/* === PAINÉIS, FILTROS E FORMULÁRIOS === */
.panel { padding: 24px; margin-bottom: 18px; }
.panel h2 { margin-top: 0; font-size: 17px; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
.muted { color: var(--muted); }

.field {
  width: 100%;
  padding: 10px 13px;
  border: 1px solid var(--line);
  border-radius: 10px;
  outline: none;
  background: var(--panel-alt);
  color: var(--ink);
  transition: 0.15s;
}
.field:focus { border-color: var(--accent); background: var(--panel); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 6px; }
.filter {
  border: 1px solid var(--line);
  background: var(--panel-alt);
  border-radius: 100px;
  padding: 7px 13px;
  color: var(--muted);
  font-weight: 600;
  font-size: 12px;
  transition: 0.15s;
}
.filter:hover { border-color: var(--accent); color: var(--ink); }
.filter.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.results { display: grid; gap: 12px; }
.result {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
  padding: 18px 22px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.16s ease;
}
.result h3 { margin: 8px 0 5px; font-size: 16px; }
.result p { margin: 0; color: var(--muted); font-size: 12.5px; }

/* === DETALHES DA NATUREZA & FERRAMENTAS COPOM === */
.detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; }
.detail-head h1 { font-size: 26px; letter-spacing: -0.7px; margin: 10px 0 8px; line-height: 1.22; }

.op-meta-grid {
  display: grid;

const $ = id => document.getElementById(id);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c] || c));
}

function txt(s) {
  let d = document.createElement('div');
  d.innerHTML = s || '';
  return d.textContent || '';
}

function norm(s) {
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('pt-BR');
}

function safe(s) {
  let d = new DOMParser().parseFromString(s || '', 'text/html');
  d.querySelectorAll('script,style,iframe,object,embed,svg,math,form,link,meta').forEach(n => n.remove());
  d.querySelectorAll('*').forEach(n => Array.from(n.attributes).forEach(a => {
    if (/^on/i.test(a.name) || a.name === 'style' || a.name === 'srcdoc' || (['href', 'src'].includes(a.name) && !(/^(https?:|mailto:|#)/i.test(a.value)))) {
      n.removeAttribute(a.name);
    }
  }));
  return d.body.innerHTML;
}

function toast(s) {
  let t = $('toast');
  t.textContent = s;
  t.classList.remove('hidden');
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => t.classList.add('hidden'), 2800);
}

function initials(s) {
  return String(s || 'U').split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
}

function date(s) {
  try { return new Date(s).toLocaleDateString('pt-BR'); } catch(e) { return ''; }
}

function catIcon(s) {
  return (categories.find(c => c.name === s) || categories[6]).icon;

      toast('Natureza copiada: ' + b.dataset.copynature);
    };
  });
  container.querySelectorAll('[data-copytext]').forEach(b => {
    b.onclick = () => {
      navigator.clipboard?.writeText(b.dataset.copytext);
      toast('Relato técnico copiado para a área de transferência!');
    };
  });
  container.querySelectorAll('[data-open]').forEach(b => {
    b.onclick = () => openArticle(b.dataset.open);
  });
  container.querySelectorAll('[data-go]').forEach(b => {
    b.onclick = () => go(b.dataset.go);

function showModal(opts) {

          ${opts.cancelText !== false ? `<button class="btn secondary" id="modalCancelBtn">${esc(opts.cancelText || 'Fechar')}</button>` : ''}
          ${opts.confirmText ? `<button class="btn ${opts.danger ? 'danger' : ''}" id="modalConfirmBtn">${esc(opts.confirmText)}</button>` : ''}
        </div>
      </div>
    </div>
  `;
  $('modalCloseBtn').onclick = closeModal;
  if ($('modalCancelBtn')) $('modalCancelBtn').onclick = closeModal;
  $('modalBackdrop').onclick = e => { if (e.target.id === 'modalBackdrop') closeModal(); };
  if ($('modalConfirmBtn')) {
    $('modalConfirmBtn').onclick = () => {
      if (opts.onConfirm) opts.onConfirm();
    };
  }
}

          <span><b>Ctrl + K</b> Busca Rápida Global</span>
        </div>
      </div>
    </div>
  `;
  const input = $('cmdInput');
  const listEl = $('cmdResults');

  function getFiltered() {
    let q = input.value.trim();
    return data.articles
      .map(a => ({ a, score: scoreArticle(a, q) }))
      .filter(x => !q || x.score > 0)
      .sort((x, y) => y.score - x.score)
      .slice(0, 8)
      .map(x => x.a);
  }

  function renderCmdList() {
    let items = getFiltered();
    if (selectedIdx >= items.length) selectedIdx = Math.max(0, items.length - 1);
    if (!items.length) {
      listEl.innerHTML = '<div class="empty" style="padding:28px"><b>Nenhuma natureza encontrada</b><small>Pressione Enter para analisar com o Cérebro 190 na Pesquisa Avançada</small></div>';
      return;
    }
    listEl.innerHTML = items.map((a, idx) => `
      <button class="cmd-item ${idx === selectedIdx ? 'selected' : ''}" data-cmdopen="${esc(a.id)}">
        <div style="min-width:0">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
            <span class="code">${highlight(a.code, input.value)}</span>
            <strong style="font-size:13px">${highlight(a.title, input.value)}</strong>
          </div>
          <div class="muted" style="font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${highlight(a.summary, input.value)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          ${prioBadge(a.priority)}
          <span style="color:var(--accent)">↵</span>
        </div>
      </button>
    `).join('');
    listEl.querySelectorAll('[data-cmdopen]').forEach(b => {
      b.onclick = () => {
        closeModal();
        openArticle(b.dataset.cmdopen);
      };
    });
  }

  input.oninput = () => { selectedIdx = 0; renderCmdList(); };
  input.onkeydown = e => {
    let items = getFiltered();
    if (e.key === 'ArrowDown') { e.preventDefault(); selectedIdx = (selectedIdx + 1) % Math.max(1, items.length); renderCmdList(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); selectedIdx = (selectedIdx - 1 + Math.max(1, items.length)) % Math.max(1, items.length); renderCmdList(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (items[selectedIdx]) { closeModal(); openArticle(items[selectedIdx].id); }
      else if (input.value.trim()) { query = input.value.trim(); closeModal(); go('search'); }
    }
    else if (e.key === 'Escape') { closeModal(); }
  };
  $('cmdBackdrop').onclick = e => { if (e.target.id === 'cmdBackdrop') closeModal(); };
  renderCmdList();
  setTimeout(() => input.focus(), 20);
}

/* === MOTOR DE BUSCA POR RELEVÂNCIA E DESTAQUE (<MARK>) === */
function parseSearchTerms(q) {
  let out = [];
  for (const m of String(q || '').matchAll(/"([^"]+)"|(\S+)/g)) {
    if (m[1]) out.push({ term: norm(m[1]), exact: true, raw: m[1] });
    else if (m[2]) out.push({ term: norm(m[2]), exact: false, raw: m[2] });
  }
  return out;
}

function containsExactPhrase(hay, needle) {
  let h = norm(hay);
  let i = h.indexOf(needle);
  while (i !== -1) {
    let before = h[i - 1] || ' ';
    let after = h[i + needle.length] || ' ';
    if (!/[\p{L}\p{N}_]/u.test(before) && !/[\p{L}\p{N}_]/u.test(after)) return true;
    i = h.indexOf(needle, i + 1);
  }
  return false;
}

function scoreArticle(a, q) {
  let ts = parseSearchTerms(q);
  if (!ts.length) return 1;
  let code = norm(a.code);
  let title = norm(a.title);
  let tags = norm((a.tags || []).join(' '));
  let summary = norm(a.summary);
  let extra = norm([a.category, a.legalBase, a.agency, a.differentiation, (a.triageChecklist || []).join(' '), txt(a.content)].join(' '));
  let full = [code, title, tags, summary, extra].join(' ');

  // Se for um relato longo colado (mais de 5 palavras), pontua por qualquer palavra-chave relevante encontrada
  const stopWords = new Set(['uma','que','esta','sendo','pelo','seu','sua','seus','dentro','frente','para','com','por','dos','das','nos','nas','ele','ela','foi','sao','nao','sim','como','qual','entre']);
  const meaningfulTerms = ts.filter(t => t.term.length >= 3 && !stopWords.has(t.term));

  if (ts.length >= 5 && meaningfulTerms.length) {
    let relatoScore = 0;
    meaningfulTerms.forEach(t => {
      if (title.includes(t.term)) relatoScore += 12;
      if (tags.includes(t.term)) relatoScore += 10;
      if (summary.includes(t.term)) relatoScore += 5;
      if (extra.includes(t.term)) relatoScore += 3;
    });
    return relatoScore;
  }

  let totalScore = 0;
  for (let t of ts) {
    if (t.exact) {
      if (!containsExactPhrase(full, t.term)) return 0;
      totalScore += 12;
    } else {
      if (!full.includes(t.term)) return 0;
      if (code === t.term) totalScore += 25;
      else if (code.includes(t.term)) totalScore += 15;
      if (title.includes(t.term)) totalScore += 10;
      if (tags.includes(t.term)) totalScore += 6;
      if (summary.includes(t.term)) totalScore += 4;
      if (extra.includes(t.term)) totalScore += 2;
    }
  }
  return totalScore;
}

function highlight(text, q) {
  let safeText = esc(text || '');
  const stopWords = new Set(['uma','que','esta','sendo','pelo','seu','sua','seus','dentro','frente','para','com']);
  let ts = parseSearchTerms(q).map(x => x.raw).filter(x => x.length >= 3 && !stopWords.has(norm(x)));
  if (!ts.length) return safeText;
  let pattern = ts.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
  try {
    let regex = new RegExp('(' + pattern + ')', 'gi');
    return safeText.replace(regex, '<mark>$1</mark>');
  } catch(e) {
    return safeText;
  }
}

function relatedArticles(a) {
  let tags = new Set((a.tags || []).map(norm));
  return data.articles
    .filter(x => x.id !== a.id)
    .map(x => ({
      article: x,
      score: (x.category === a.category ? 3 : 0) + (x.tags || []).filter(t => tags.has(norm(t))).length * 2
    }))
    .filter(x => x.score > 0)
    .sort((x, y) => y.score - x.score)
    .slice(0, 4)
    .map(x => x.article);
}

function downloadText(filename, content, type) {
  let url = URL.createObjectURL(new Blob([content], { type: type || 'text/plain;charset=utf-8' }));
  let link = document.createElement('a');

  link.download = filename;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

  $('prioInput').value = priorityFilter;

  $('searchInput').oninput = e => { query = e.target.value; refreshResults(); };
  document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => {
    category = b.dataset.filter;

function refreshResults() {
  // 1. Aciona o Cérebro 190 se houver um relato ou pergunta digitada
  const brainBox = $('searchBrainBox');
  if (brainBox) {
    if (query.trim().length >= 8 && window.CEREBRO_190?.analisarEntrada) {
      const analise = window.CEREBRO_190.analisarEntrada(query, customBrainRules);
      brainBox.innerHTML = renderBrainDiagnosisHTML(analise);
      bindDiagnosisActions(brainBox);
    } else {
      brainBox.innerHTML = '';
    }
  }

  // 2. Filtra e pontua os artigos do catálogo
  let base = page === 'favorites'
    ? data.articles.filter(a => data.favorites.includes(a.id))
    : page === 'recent'
    ? data.recent.map(articleById).filter(Boolean)
    : data.articles;

  const prioWeight = { 'Crítica': 4, 'Alta': 3, 'Média': 2, 'Baixa': 1 };

  let scored = base
    .filter(a => (category === 'Todas' || a.category === category))
    .filter(a => (priorityFilter === 'Todas' || (a.priority || 'Média') === priorityFilter))
    .map(a => ({ a, score: scoreArticle(a, query) }))
    .filter(x => x.score > 0);

  if (sort === 'relevance') {
    scored.sort((x, y) => y.score - x.score || ((y.a.views || 0) - (x.a.views || 0)));
  } else if (sort === 'priority') {
    scored.sort((x, y) => (prioWeight[y.a.priority] || 2) - (prioWeight[x.a.priority] || 2));
  } else if (sort === 'alphabetical') {
    scored.sort((x, y) => x.a.title.localeCompare(y.a.title, 'pt-BR'));
  } else if (sort === 'recent') {
    scored.sort((x, y) => new Date(y.a.updated) - new Date(x.a.updated));
  }

  let items = scored.map(x => x.a);
  if ($('resultCountBadge')) $('resultCountBadge').textContent = items.length + (items.length === 1 ? ' resultado' : ' resultados');

  let out = $('resultList');
  out.innerHTML = items.length ? items.map(a => `
    <div class="result" data-open="${esc(a.id)}">
      <div style="min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="code">${highlight(a.code, query)}</span>
          ${prioBadge(a.priority)}
          <span class="muted" style="font-size:11.5px">${catIcon(a.category)} ${esc(a.category)}</span>
          ${a.legalBase ? `<span class="muted" style="font-size:11.5px">· ⚖ ${highlight(a.legalBase, query)}</span>` : ''}
        </div>
        <h3>${highlight(a.title, query)}</h3>
        <p>${highlight(a.summary, query)}</p>
        <div class="tags">${(a.tags || []).slice(0, 6).map(t => `<span class="tag">#${highlight(t, query)}</span>`).join('')}</div>
      </div>
      <span style="color:var(--accent);font-size:20px;font-weight:700;flex-shrink:0">→</span>
    </div>
  `).join('') : `
    <div class="panel empty">
      <div style="font-size:36px">⌕</div>
      <b>Nenhuma ficha adicional encontrada no filtro abaixo</b>
      <p>Verifique o Diagnóstico do Cérebro 190 acima ou limpe os filtros para ver todo o catálogo.</p>
      <button class="btn secondary small" id="resetSearchBtn" style="margin-top:8px">Limpar filtros de busca</button>
    </div>
  `;

  if ($('resetSearchBtn')) {
    $('resetSearchBtn').onclick = () => {
      query = '';
      category = 'Todas';
      priorityFilter = 'Todas';
      listing();
    };
  }
  bindCards();
}

  let a = articleById(id);
  if (!a) return;
  if (page !== 'detail' && page !== 'edit') previousPage = page;
  current = id;
  a.views = (a.views || 0) + 1;
  data.recent = [id, ...data.recent.filter(x => x !== id)].slice(0, 20);
  saveData();
  page = 'detail';
  render();
  window.scrollTo(0, 0);
}

function detail() {
  let a = articleById(current);
  if (!a) return go('catalog');
  let favorite = data.favorites.includes(a.id);
  let checkedMap = triageState[a.id] || {};
  let checklist = Array.isArray(a.triageChecklist) ? a.triageChecklist : [];
  let checkedCount = checklist.filter((_, idx) => checkedMap[idx]).length;

  let rawMask = a.dispatchTemplate || '';
  let placeholders = [...new Set([...rawMask.matchAll(/\[([^\]]+)\]/g)].map(m => m[1]))];

  $('content').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap" class="no-print">
      <button class="btn secondary small" id="back">← Voltar para ${previousPage === 'search' ? 'Pesquisa' : previousPage === 'favorites' ? 'Favoritos' : previousPage === 'recent' ? 'Recentes' : previousPage === 'chatbot' ? 'Chatbot IA' : previousPage === 'home' ? 'Início' : 'Catálogo'}</button>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ${favorite ? 'ghost' : 'secondary'} small" id="favoriteBtn">${favorite ? '★ Favoritado' : '☆ Favoritar'}</button>
        <button class="btn secondary small" id="copyRefBtn">⧉ Copiar Referência</button>
        <button class="btn secondary small" id="printBtn">▤ Imprimir / PDF</button>
        <button class="btn secondary small" id="exportArticleBtn">↓ Exportar HTML</button>
        ${user.role === 'admin' ? `<button class="btn small" id="editBtn">✎ Editar Natureza</button>` : ''}
      </div>
    </div>

    <div class="grid2" style="margin-top:16px">
      <div>
        <div class="panel">
          <div class="detail-head">
            <div>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <span class="code">${esc(a.code)}</span>
                ${prioBadge(a.priority)}
                <span class="tag">${catIcon(a.category)} ${esc(a.category)}</span>
              </div>
              <h1>${esc(a.title)}</h1>
            </div>
          </div>
          <p class="muted" style="font-size:14px;margin:4px 0 14px">${esc(a.summary)}</p>

          <div class="op-meta-grid">
            <div class="op-meta-item">
              <small>⚖ Tipificação / Base Legal de Referência</small>
              <strong>${esc(a.legalBase || 'Consulte diretriz institucional')}</strong>
            </div>
            <div class="op-meta-item">
              <small>🚓 Competência / Empenho Operacional</small>
              <strong>${esc(a.agency || 'Polícia Militar (190)')}</strong>
            </div>
          </div>

          ${a.differentiation ? `
            <div class="diff-alert">
              <b>⚠ Atenção na Triagem (Diferenciação / Enquadramento):</b>
              <span>${esc(a.differentiation)}</span>
            </div>
          ` : ''}

          ${checklist.length ? `
            <div class="triage-box">
              <div class="triage-header">
                <div>
                  <strong style="font-size:14.5px">📋 Roteiro de Triagem Telefônica 190</strong>
                  <div class="muted" style="font-size:11.5px">Marque os itens verificados durante a entrevista com o solicitante</div>
                </div>
                <div style="display:flex;align-items:center;gap:8px">
                  <span class="badge" id="triageCounter">${checkedCount}/${checklist.length} verificados</span>
                  <button class="btn secondary small no-print" id="resetTriageBtn">Limpar</button>
                </div>
              </div>
              <div id="triageList">
                ${checklist.map((q, idx) => `
                  <label class="triage-item ${checkedMap[idx] ? 'checked' : ''}" data-tidx="${idx}">
                    <input type="checkbox" ${checkedMap[idx] ? 'checked' : ''}>
                    <span><b>${idx + 1}.</b> ${esc(q)}</span>
                  </label>
                `).join('')}
              </div>
            </div>
          ` : ''}

          ${rawMask ? `
            <div class="dispatch-box">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
                <div>
                  <strong style="font-size:14.5px">⚡ Gerador de Relato Padrão COPOM (Máscara de Despacho)</strong>
                  <div class="muted" style="font-size:11.5px">Preencha os campos variáveis abaixo ou edite diretamente o texto final antes de copiar</div>
                </div>
                <div style="display:flex;gap:6px">
                  <button class="btn secondary small" id="resetMaskBtn">↺ Resetar</button>
                  <button class="btn small" id="copyMaskBtn">⧉ Copiar Relato COPOM</button>
                </div>
              </div>
              ${placeholders.length ? `
                <div class="dispatch-vars">
                  ${placeholders.map(ph => `
                    <input type="text" data-ph="${esc(ph)}" placeholder="[${esc(ph)}]" title="Preencher [${esc(ph)}]">
                  `).join('')}
                </div>
              ` : ''}
              <textarea id="dispatchOutput" rows="4">${esc(rawMask)}</textarea>
            </div>
          ` : ''}

          <div class="article-body" id="articleBodyContent">${safe(a.content)}</div>

          <hr style="border:0;border-top:1px solid var(--line);margin:24px 0 14px">
          <div class="meta">
            <span>✎ Responsável: <b>${esc(a.author)}</b></span>
            <span>◷ Atualizado em ${date(a.updated)}</span>
            <span>◉ ${a.views || 0} consultas registradas</span>
          </div>
          <div class="tags">${(a.tags || []).map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>
        </div>

        <div class="panel no-print">
          <h2>💬 Observações Operacionais e Dúvidas (${(a.comments || []).length})</h2>
          <div id="comments">
            ${(a.comments || []).length ? [...a.comments].sort((x, y) => (y.pinned ? 1 : 0) - (x.pinned ? 1 : 0)).map((c, i) => `
              <div class="comment ${c.pinned ? 'pinned' : ''}">
                <div class="comment-head">
                  <div>
                    <b>${esc(c.author)}</b>
                    <span class="tag" style="margin-left:6px">${esc(c.type || 'Observação')}</span>
                    ${c.pinned ? `<span class="badge" style="margin-left:4px">📌 Fixado</span>` : ''}
                    <small class="muted" style="margin-left:6px">${date(c.date)}</small>
                  </div>
                  <div style="display:flex;gap:4px">
                    ${user.role === 'admin' ? `<button class="btn secondary small" data-pincomment="${esc(c.id || i)}" title="Fixar/Desafixar">📌</button>` : ''}
                    ${(user.role === 'admin' || c.author === user.name) ? `<button class="btn danger small" data-delcomment="${esc(c.id || i)}" title="Excluir comentário">✕</button>` : ''}
                  </div>
                </div>
                <div>${esc(c.text)}</div>
              </div>
            `).join('') : '<p class="muted" style="font-size:12.5px">Nenhuma observação operacional registrada para esta natureza.</p>'}
          </div>
          <div class="form-grid" style="margin-top:14px">
            <div>
              <label class="label">Tipo de apontamento</label>
              <select id="commentType" class="field">
                <option>Dúvida Operacional</option>
                <option>Orientação de Supervisão</option>
                <option>Sugestão de Melhoria</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="label">Nova observação para a equipe</label>
            <textarea class="field" id="commentText" rows="2" placeholder="Registre uma orientação de despacho, particularidade regional ou dúvida..."></textarea>
          </div>
          <button class="btn small" id="addComment">Publicar na ficha</button>
        </div>
      </div>

      <div class="no-print">
        <div class="panel" id="tocPanel">
          <h2>📑 Índice da Ficha</h2>
          <div id="tocList"></div>
        </div>

        <div class="panel">
          <h2>🔗 Naturezas Relacionadas</h2>
          <div id="relatedList"></div>
        </div>

        <div class="panel">
          <h2>🕓 Histórico de Revisões (${(a.history || []).length})</h2>
          <div id="revisionList"></div>
        </div>

        <div class="panel">
          <b>🛡️ Nota Institucional</b>
          <p class="muted" style="font-size:12px;margin-bottom:0">Ambiente demonstrativo de gestão do conhecimento. Valide sempre os códigos finais e diretrizes operacionais no sistema oficial da corporação.</p>
        </div>
      </div>
    </div>
  `;

  $('back').onclick = () => go(previousPage || 'catalog');
  $('favoriteBtn').onclick = () => {
    data.favorites = favorite ? data.favorites.filter(id => id !== a.id) : [...data.favorites, a.id];
    saveData();
    detail();
    toast(favorite ? 'Removido dos favoritos' : 'Adicionado aos favoritos');
  };
  $('copyRefBtn').onclick = () => {
    let text = a.code + ' — ' + a.title + ' | ' + a.summary;
    navigator.clipboard?.writeText(text).then(() => toast('Referência copiada!')).catch(() => toast('Não foi possível copiar'));
  };
  $('printBtn').onclick = () => window.print();
  $('exportArticleBtn').onclick = () => exportArticle(a);
  if ($('editBtn')) $('editBtn').onclick = () => { editId = a.id; page = 'edit'; render(); };

  document.querySelectorAll('[data-tidx]').forEach(lbl => {
    let input = lbl.querySelector('input');
    input.onchange = () => {
      let idx = +lbl.dataset.tidx;
      triageState[a.id] = triageState[a.id] || {};
      triageState[a.id][idx] = input.checked;
      lbl.classList.toggle('checked', input.checked);
      let totalChecked = checklist.filter((_, i) => triageState[a.id][i]).length;
      $('triageCounter').textContent = `${totalChecked}/${checklist.length} verificados`;
    };
  });
  if ($('resetTriageBtn')) {
    $('resetTriageBtn').onclick = () => {
      triageState[a.id] = {};
      detail();
      toast('Checklist de triagem reiniciado');
    };
  }

  const maskInputs = document.querySelectorAll('[data-ph]');
  function rebuildMask() {
    let text = rawMask;
    maskInputs.forEach(inp => {
      let val = inp.value.trim();
      let ph = inp.dataset.ph;
      if (val) text = text.split('[' + ph + ']').join(val.toUpperCase());
    });
    if ($('dispatchOutput')) $('dispatchOutput').value = text;
  }
  maskInputs.forEach(inp => inp.oninput = rebuildMask);
  if ($('resetMaskBtn')) {
    $('resetMaskBtn').onclick = () => {
      maskInputs.forEach(inp => inp.value = '');
      if ($('dispatchOutput')) $('dispatchOutput').value = rawMask;
      toast('Máscara restaurada ao padrão');
    };
  }
  if ($('copyMaskBtn')) {
    $('copyMaskBtn').onclick = () => {
      let text = $('dispatchOutput').value.trim();
      navigator.clipboard?.writeText(text).then(() => toast('Relato padrão COPOM copiado para a área de transferência!'));
    };
  }

  let headings = Array.from($('articleBodyContent').querySelectorAll('h2, h3'));
  if (headings.length) {
    $('tocList').innerHTML = headings.map((h, i) => {
      let hid = 'sec-' + i;
      h.id = hid;
      return `<button class="toc-link" data-scrollto="${hid}"><span>▸</span><span>${esc(h.textContent)}</span></button>`;
    }).join('');
    document.querySelectorAll('[data-scrollto]').forEach(b => {
      b.onclick = () => document.getElementById(b.dataset.scrollto)?.scrollIntoView({ behavior: 'smooth' });
    });
  } else {
    $('tocList').innerHTML = '<p class="muted" style="font-size:12px;margin:0">Artigo em seção única.</p>';
  }

  let related = relatedArticles(a);
  $('relatedList').innerHTML = related.length ? related.map(x => `
    <button class="related-link" data-related="${esc(x.id)}">
      <span class="code">${esc(x.code)}</span>
      <span>${esc(x.title)}</span>
      <span>↗</span>
    </button>
  `).join('') : '<p class="muted" style="font-size:12px;margin:0">Nenhuma natureza diretamente relacionada.</p>';
  document.querySelectorAll('[data-related]').forEach(b => b.onclick = () => openArticle(b.dataset.related));

  let versions = a.history || [];
  $('revisionList').innerHTML = versions.length ? versions.map((v, i) => `
    <div class="revision-item">
      <div>
        <b>Versão ${i + 1}</b>
        <div class="muted" style="font-size:11px">${date(v.date)} · ${esc(v.author || a.author)}</div>
      </div>
      <div style="display:flex;gap:4px">
        <button class="btn secondary small" data-viewrev="${i}">Comparar</button>
        ${user.role === 'admin' ? `<button class="btn ghost small" data-restorerev="${i}">Restaurar</button>` : ''}
      </div>
    </div>
  `).join('') : '<p class="muted" style="font-size:12px;margin:0">Nenhuma revisão anterior registrada.</p>';
  document.querySelectorAll('[data-viewrev]').forEach(b => b.onclick = () => showRevisionModal(a, +b.dataset.viewrev));
  document.querySelectorAll('[data-restorerev]').forEach(b => b.onclick = () => restoreRevision(a, +b.dataset.restorerev));

  $('addComment').onclick = () => {
    let t = $('commentText').value.trim();
    if (!t) return toast('Digite o texto da observação');
    a.comments = a.comments || [];
    a.comments.push({
      id: 'cm-' + Date.now(),
      author: user.name,
      type: $('commentType').value,
      pinned: false,
      text: t,
      date: now()
    });
    saveData();
    detail();
    toast('Observação adicionada à ficha');
  };
  document.querySelectorAll('[data-delcomment]').forEach(b => {
    b.onclick = () => {
      let cid = b.dataset.delcomment;
      a.comments = (a.comments || []).filter((c, idx) => String(c.id || idx) !== cid);
      saveData();
      detail();
      toast('Observação removida');
    };
  });
  document.querySelectorAll('[data-pincomment]').forEach(b => {
    b.onclick = () => {
      let cid = b.dataset.pincomment;
      let target = (a.comments || []).find((c, idx) => String(c.id || idx) === cid);
      if (target) target.pinned = !target.pinned;
      saveData();
      detail();
      toast('Destaque atualizado');
    };
  });
}

        </div>
        <div class="form-group">
          <label class="label">Máscara de Despacho COPOM (Use [COLCHETES] para variáveis)</label>
          <textarea id="editDispatch" class="field" rows="4" placeholder="SOLICITANTE INFORMA [FATO] NO LOCAL [ENDEREÇO]. AUTOR TRAJANDO [ROUPAS]. VIATURA SOLICITADA PARA AVERIGUAÇÃO.">${esc(a?.dispatchTemplate || '')}</textarea>
        </div>
      </div>

      <div class="form-group">
        <label class="label">Conteúdo Detalhado e Procedimentos Operacionais</label>
        <div class="toolbar">
          <button type="button" data-command="bold"><b>B</b></button>
          <button type="button" data-command="italic"><i>I</i></button>
          <button type="button" data-command="underline"><u>U</u></button>
          <button type="button" data-command="formatBlock" data-value="h2">Título H2</button>
          <button type="button" data-command="formatBlock" data-value="h3">Subtítulo H3</button>
          <button type="button" data-command="insertUnorderedList">• Lista</button>
          <button type="button" data-command="insertOrderedList">1. Lista</button>
          <button type="button" id="linkBtn">🔗 Link</button>
          <button type="button" id="tableBtn">▦ Tabela</button>
          <button type="button" data-command="strikeThrough">Riscado</button>
          <button type="button" data-command="removeFormat">Limpar formato</button>
          <button type="button" data-command="justifyLeft">Esquerda</button>
          <button type="button" data-command="justifyCenter">Centro</button>
          <button type="button" data-command="justifyRight">Direita</button>
          <button type="button" data-command="outdent">Recuar −</button>
          <button type="button" data-command="indent">Recuar +</button>
          <button type="button" id="quoteBtn">❝ Destaque</button>
          <button type="button" id="dividerBtn">― Linha</button>
          <button type="button" id="calloutBtn">ⓘ Aviso</button>
          <button type="button" id="checklistBtn">☑ Checklist</button>
          <button type="button" id="undoBtn">↶ Desfazer</button>
          <button type="button" id="redoBtn">↷ Refazer</button>
        </div>
        <div class="editor" id="editBody" contenteditable="true" aria-label="Editor de conteúdo" spellcheck="true"></div>
        <div class="editor-status">
          <span id="wordCount">0 palavras</span>
          <span>Selecione texto para formatar · O HTML é automaticamente sanitizado ao salvar</span>
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px">
        <button class="btn secondary" id="previewBtn">👁 Pré-visualizar em Modal</button>
        <button class="btn" id="saveBtn">✓ Publicar na Base 190</button>
      </div>
    </div>
  `;

  $('editCategory').value = a?.category || 'Ordem pública';
  $('editPriority').value = a?.priority || 'Média';
  $('editBody').innerHTML = a ? safe(a.content) : '<h2>Visão geral operacional</h2><p>Descreva aqui as orientações técnicas da natureza.</p>';
  $('cancelEdit').onclick = () => go('manage');

  let countWords = () => {
    let text = txt($('editBody').innerHTML).trim();
    $('wordCount').textContent = (text ? text.split(/\s+/).length : 0) + ' palavras · ' + text.length + ' caracteres';
  };
  $('editBody').addEventListener('input', countWords);
  countWords();

  document.querySelectorAll('[data-command]').forEach(b => b.onclick = () => {
    $('editBody').focus();
    document.execCommand(b.dataset.command, false, b.dataset.value || null);
  });
  $('linkBtn').onclick = () => {
    showModal({
      title: 'Inserir Link Externo',
      bodyHtml: `<label class="label">URL do Link (https://...)</label><input id="modalLinkUrl" class="field" placeholder="https://...">`,
      cancelText: 'Cancelar',
      confirmText: 'Inserir Link',
      onConfirm: () => {
        let url = $('modalLinkUrl').value.trim();
        closeModal();
        if (url && /^https?:\/\//i.test(url)) {
          $('editBody').focus();
          document.execCommand('createLink', false, url);
        }
      }
    });
  };
  $('tableBtn').onclick = () => appendEditorHTML('<table><thead><tr><th>Situação</th><th>Conduta COPOM</th></tr></thead><tbody><tr><td>Exemplo</td><td>Procedimento</td></tr></tbody></table><p></p>');
  $('quoteBtn').onclick = () => appendEditorHTML('<blockquote><p>Informação importante</p></blockquote><p></p>');
  $('dividerBtn').onclick = () => appendEditorHTML('<hr><p></p>');
  $('calloutBtn').onclick = () => appendEditorHTML('<blockquote><strong>ⓘ Orientação Importante:</strong> Descreva o ponto de atenção aqui.</blockquote><p></p>');
  $('checklistBtn').onclick = () => appendEditorHTML('<ul><li>☐ Item a verificar</li><li>☐ Outro item</li></ul><p></p>');
  $('undoBtn').onclick = () => richCommand('undo');
  $('redoBtn').onclick = () => richCommand('redo');

  $('previewBtn').onclick = () => {
    showModal({
      title: 'Pré-visualização: ' + ($('editTitle').value || 'Sem título'),
      bodyHtml: `<div class="article-body">${safe($('editBody').innerHTML)}</div>`
    });
  };

  $('saveBtn').onclick = () => {
    let title = $('editTitle').value.trim();
    let code = $('editCode').value.trim().toUpperCase();
    if (!title || !code) return toast('Preencha obrigatoriamente o Título e o Código');
    if (data.articles.some(x => x.code.toLowerCase() === code.toLowerCase() && x.id !== a?.id)) {
      return toast('Já existe outra natureza cadastrada com este código');
    }

    let obj = {
      title,
      code,
      priority: $('editPriority').value,
      category: $('editCategory').value,
      legalBase: $('editLegal').value.trim(),
      agency: $('editAgency').value.trim(),
      differentiation: $('editDiff').value.trim(),
      triageChecklist: $('editChecklist').value.split('\n').map(x => x.trim()).filter(Boolean),
      dispatchTemplate: $('editDispatch').value.trim(),
      tags: $('editTags').value.split(',').map(x => x.trim()).filter(Boolean),
      summary: $('editSummary').value.trim() || title,
      content: safe($('editBody').innerHTML),
      updated: now()
    };

    if (a) {
      a.history = a.history || [];
      a.history.push({ date: a.updated, author: user.name, content: a.content, title: a.title });
      Object.assign(a, obj);
    } else {
      a = Object.assign({
        id: 'local-' + Date.now(),
        author: user.name,
        created: now(),
        views: 1,
        comments: [],
        history: []
      }, obj);
      data.articles.unshift(a);
    }
    saveData();
    toast('Natureza publicada com sucesso!');
    openArticle(a.id);
  };
}

function exportData() {
  downloadText('base190-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(data, null, 2), 'application/json');
}

function importData(e) {
  let f = e.target.files[0];
  if (!f) return;
  f.text().then(s => {
    try {
      let parsed = JSON.parse(s);
      if (!parsed || !Array.isArray(parsed.articles)) throw Error('invalid');
      showModal({
        title: 'Importar Backup JSON',
        bodyHtml: `<p>O arquivo selecionado contém <b>${parsed.articles.length} naturezas</b>. Deseja substituir a base atual por este backup?</p>`,
        cancelText: 'Cancelar',
        confirmText: 'Importar agora',
        onConfirm: () => {
          data = {
            articles: parsed.articles.map(a => ({
              ...a,
              content: safe(a.content),
              comments: Array.isArray(a.comments) ? a.comments : [],
              history: Array.isArray(a.history) ? a.history : [],
              tags: Array.isArray(a.tags) ? a.tags : [],
              triageChecklist: Array.isArray(a.triageChecklist) ? a.triageChecklist : []
            })),
            favorites: Array.isArray(parsed.favorites) ? parsed.favorites : [],
            recent: [],
            settings: data.settings
          };
          saveData();
          closeModal();
          manage();
          toast('Backup importado com sucesso!');
        }
      });
    } catch(err) {
      toast('Arquivo JSON inválido ou corrompido');
    }
  });
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && user) {
    e.preventDefault();
    openCommandPalette();
  }
  if (e.key === 'Escape') {
    if ($('modalRoot').innerHTML) closeModal();
    if ($('sidebar')) $('sidebar').classList.remove('open');
  }
});

render();
})();
</script>
</body>
</html>

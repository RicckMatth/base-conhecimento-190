{id:'oc01',code:'DEM-001',title:'Perturbação do sossego',category:'Ordem pública',summary:'Entenda o conceito geral e os termos associados a registros de perturbação do sossego.',tags:['barulho','som alto','ruído','vizinhança'],content:'<h2>Visão geral</h2><p>Termo comumente utilizado em relatos de ruído excessivo, som alto e incômodo ao sossego. O enquadramento e a natureza oficial dependem das normas e classificações vigentes na instituição.</p><h2>Exemplos de descrição</h2><ul><li>Relato de música em volume elevado.</li><li>Queixa sobre barulho persistente em imóvel próximo.</li><li>Solicitação de orientação relacionada a ruído.</li></ul><blockquote>Conteúdo ilustrativo. Confirme o código e o procedimento na documentação oficial.</blockquote>',author:'Equipe de demonstração',created:now(),updated:now(),views:0,comments:[],history:[]},
{id:'oc02',code:'DEM-002',title:'Acidente de trânsito sem vítimas',category:'Trânsito',summary:'Referência ilustrativa para registros de colisões e incidentes viários sem relato inicial de feridos.',tags:['colisão','veículo','trânsito','batida'],content:'<h2>Conceito</h2><p>Ocorrência de trânsito com relato inicial de danos materiais, sem indicação de pessoas feridas no momento do registro.</p><h2>Pontos de compreensão</h2><p>A descrição inicial pode ser atualizada conforme surgem novas informações. A classificação final deve seguir o catálogo institucional.</p>',author:'Equipe de demonstração',created:now(),updated:now(),views:0,comments:[],history:[]},
{id:'oc03',code:'DEM-003',title:'Ameaça',category:'Pessoas',summary:'Explicação introdutória de relatos envolvendo intimidação ou ameaça dirigida a uma pessoa.',tags:['intimidação','ameaça verbal','conflito'],content:'<h2>Visão geral</h2><p>Registros em que uma pessoa relata ter recebido palavras, mensagens ou gestos interpretados como ameaça.</p><h2>Atenção</h2><p>A natureza definitiva e a avaliação jurídica não podem ser determinadas apenas por palavras-chave. Consulte as orientações oficiais aplicáveis.</p>',author:'Equipe de demonstração',created:now(),updated:now(),views:0,comments:[],history:[]},
{id:'oc04',code:'DEM-004',title:'Furto',category:'Patrimônio',summary:'Consulta conceitual sobre subtração de bem sem descrição inicial de violência ou grave ameaça.',tags:['objeto','subtração','patrimônio','desaparecimento'],content:'<h2>Definição geral</h2><p>Em linguagem jurídica geral, furto envolve subtração de coisa alheia móvel. A análise de um caso concreto exige informações adicionais.</p><h2>Termos relacionados</h2><p>Objeto subtraído, patrimônio, relato de desaparecimento de bem.</p>',author:'Equipe de demonstração',created:now(),updated:now(),views:0,comments:[],history:[]},
{id:'oc05',code:'DEM-005',title:'Violência doméstica e familiar',category:'Proteção',summary:'Panorama introdutório de relatos de violência em contexto doméstico ou familiar.',tags:['violência doméstica','proteção','família','agressão'],content:'<h2>Contexto geral</h2><p>Relatos envolvendo violência física, psicológica, sexual, patrimonial ou moral em contexto doméstico ou familiar podem exigir atenção especializada.</p><blockquote>Este conteúdo é exclusivamente demonstrativo e não substitui protocolos de atendimento, proteção e encaminhamento.</blockquote>',author:'Equipe de demonstração',created:now(),updated:now(),views:0,comments:[],history:[]},
{id:'oc06',code:'DEM-006',title:'Dano ao patrimônio',category:'Patrimônio',summary:'Conceito introdutório de ocorrências envolvendo destruição, deterioração ou inutilização de bens.',tags:['dano','depredação','objeto','imóvel'],content:'<h2>Conceito geral</h2><p>Relato de dano ou deterioração de bem material, cuja avaliação depende das circunstâncias narradas.</p><h2>Exemplo fictício</h2><p>Solicitante informa ter encontrado um portão danificado.</p>',author:'Equipe de demonstração',created:now(),updated:now(),views:0,comments:[],history:[]},
{id:'oc07',code:'DEM-007',title:'Pessoa desaparecida',category:'Pessoas',summary:'Referência informativa para relatos sobre pessoa cujo paradeiro é desconhecido.',tags:['desaparecimento','pessoa','localização'],content:'<h2>Visão geral</h2><p>Relato em que familiares ou outras pessoas informam desconhecer o paradeiro de alguém.</p><p>Para procedimentos e encaminhamentos, consulte exclusivamente os protocolos oficiais.</p>',author:'Equipe de demonstração',created:now(),updated:now(),views:0,comments:[],history:[]},

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&gt;','"':'&quot;'}[c]||c})}

function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR')}
function safe(s){let d=new DOMParser().parseFromString(s||'','text/html');d.querySelectorAll('script,style,iframe,object,embed,svg,math,form,link,meta').forEach(n=>n.remove());d.querySelectorAll('*').forEach(n=>Array.from(n.attributes).forEach(a=>{if(/^on/i.test(a.name)||a.name==='style'||a.name==='srcdoc'||(['href','src'].includes(a.name)&&!(/^(https?:|mailto:|#)/i.test(a.value))))n.removeAttribute(a.name)}));return d.body.innerHTML}

function showRevision(a,index){let v=(a.history||[])[index];if(!v)return;let w=window.open('','_blank');if(!w)return toast('Permita janelas para visualizar a revisão');w.document.write('<!doctype html><meta charset="utf-8"><title>Revisão</title><body style="font:16px/1.7 system-ui;max-width:800px;margin:45px auto"><h1>'+esc(v.title||a.title)+'</h1><p>Versão de '+esc(date(v.date))+' · '+esc(v.author||a.author)+'</p><hr>'+safe(v.content)+'</body>');w.document.close()}
function restoreRevision(a,index){if(user.role!=='admin')return;let v=(a.history||[])[index];if(!v||!confirm('Restaurar esta revisão? A versão atual será preservada no histórico.'))return;a.history.push({date:a.updated,author:user.name,content:a.content,title:a.title});a.content=safe(v.content);a.title=v.title||a.title;a.updated=now();saveData();detail();toast('Revisão restaurada')}

function terms(q){return [...q.matchAll(/"([^"]+)"|(\S+)/g)].map(m=>m[1]||m[2])}
function contains(h,t){let hay=norm(h),needle=norm(t),i=hay.indexOf(needle);while(i!==-1){let before=hay[i-1]||' ',after=hay[i+needle.length]||' ';if(!/[\p{L}\p{N}_]/u.test(before)&&!/[\p{L}\p{N}_]/u.test(after))return true;i=hay.indexOf(needle,i+1)}return false}
function matched(a,q){let ts=terms(q.trim());if(!ts.length)return true;let hay=[a.title,a.code,a.category,a.summary,(a.tags||[]).join(' '),txt(a.content)].join(' ');return ts.every(t=>contains(hay,t))}

querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editId=b.dataset.edit;page='edit';render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Excluir esta natureza da base local?'))return;data.articles=data.articles.filter(a=>a.id!==b.dataset.delete);data.favorites=data.favorites.filter(id=>id!==b.dataset.delete);saveData();manage();toast('Conteúdo excluído')});$('exportBtn').onclick=exportData;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=importData}
function editor(){if(user.role!=='admin')return go('home');let a=editId?articleById(editId):null;$('content').innerHTML='<div class="section-head" style="margin-top:0"><div><h1 style="margin:0">'+(a?'Editar natureza':'Nova natureza')+'</h1><p>Editor visual de conteúdos e referências</p></div><button class="btn secondary" id="cancelEdit">Cancelar</button></div><div class="panel"><div class="form-grid"><div class="form-group"><label class="label">Título da natureza *</label><input id="editTitle" class="field" placeholder="Ex.: Perturbação do sossego" value="'+esc(a?.title||'')+'"></div><div class="form-group"><label class="label">Código *</label><input id="editCode" class="field" placeholder="Ex.: DEM-009" value="'+esc(a?.code||'')+'"></div></div><div class="form-grid"><div class="form-group"><label class="label">Categoria</label><select id="editCategory" class="field">'+categories.filter(c=>c.name!=='Todas').map(c=>'<option>'+esc(c.name)+'</option>').join('')+'</select></div><div class="form-group"><label class="label">Tags (separadas por vírgula)</label><input id="editTags" class="field" placeholder="Ex.: barulho, ruído" value="'+esc((a?.tags||[]).join(', '))+'"></div></div><div class="form-group"><label class="label">Resumo para resultados de pesquisa</label><textarea id="editSummary" class="field" rows="2">'+esc(a?.summary||'')+'</textarea></div><div class="form-group"><label class="label">Conteúdo da página</label><div class="toolbar"><button data-command="bold"><b>B</b></button><button data-command="italic"><i>I</i></button><button data-command="underline"><u>U</u></button><button data-command="formatBlock" data-value="h2">Título</button><button data-command="insertUnorderedList">• Lista</button><button data-command="insertOrderedList">1. Lista</button><button id="linkBtn">🔗 Link</button><button id="tableBtn">▦ Tabela</button><button data-command="formatBlock" data-value="h3">Subtítulo</button><button data-command="strikeThrough">Riscado</button><button data-command="removeFormat">Limpar formato</button><button data-command="justifyLeft">Esquerda</button><button data-command="justifyCenter">Centro</button><button data-command="justifyRight">Direita</button><button data-command="outdent">Recuar −</button><button data-command="indent">Recuar +</button><button id="quoteBtn">❝ Destaque</button><button id="dividerBtn">― Linha</button><button id="calloutBtn">ⓘ Aviso</button><button id="checklistBtn">☑ Checklist</button><button id="undoBtn">↶ Desfazer</button><button id="redoBtn">↷ Refazer</button></div><div class="editor" id="editBody" contenteditable="true" aria-label="Editor de conteúdo" spellcheck="true"></div><div class="editor-status"><span id="wordCount">0 palavras</span><span>Selecione texto para formatar · Ctrl+B para negrito</span></div></div><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px"><button class="btn secondary" id="previewBtn">Visualizar</button><button class="btn" id="saveBtn">✓ Publicar conteúdo</button></div></div>';$('editCategory').value=a?.category||'Outros';$('editBody').innerHTML=a?safe(a.content):'<h2>Descrição geral</h2><p>Insira aqui uma descrição demonstrativa da natureza.</p>';$('cancelEdit').onclick=()=>go('manage');let countWords=()=>{let text=txt($('editBody').innerHTML).trim();$('wordCount').textContent=(text?text.split(/\s+/).length:0)+' palavras · '+text.length+' caracteres'};$('editBody').addEventListener('input',countWords);countWords();document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>{let d=$('editBody');d.focus();document.execCommand(b.dataset.command,false,b.dataset.value||null)});$('linkBtn').onclick=()=>{let url=prompt('URL do link (https://...)');if(url&&/^https:\/\//i.test(url)){ $('editBody').focus();document.execCommand('createLink',false,url)}};$('tableBtn').onclick=()=>appendEditorHTML('<table><thead><tr><th>Campo</th><th>Descrição</th></tr></thead><tbody><tr><td>Exemplo</td><td>Texto</td></tr></tbody></table><p></p>');
$('quoteBtn').onclick=()=>appendEditorHTML('<blockquote><p>Informação importante</p></blockquote><p></p>');
$('dividerBtn').onclick=()=>appendEditorHTML('<hr><p></p>');
$('calloutBtn').onclick=()=>appendEditorHTML('<blockquote><strong>ⓘ Atenção:</strong> Preencha este aviso com informações verificadas.</blockquote><p></p>');
$('checklistBtn').onclick=()=>appendEditorHTML('<ul><li>☐ Item a verificar</li><li>☐ Outro item</li></ul><p></p>');
$('undoBtn').onclick=()=>richCommand('undo');$('redoBtn').onclick=()=>richCommand('redo');$('previewBtn').onclick=()=>{let win=window.open('','_blank');if(!win)return toast('Permita a abertura de janelas');win.document.write('<!doctype html><meta charset="utf-8"><title>Prévia</title><body style="font:16px/1.7 Arial;max-width:800px;margin:40px auto"><h1>'+esc($('editTitle').value)+'</h1>'+safe($('editBody').innerHTML)+'</body>');win.document.close()};$('saveBtn').onclick=()=>{let title=$('editTitle').value.trim(),code=$('editCode').value.trim();if(!title||!code)return toast('Informe título e código');if(data.articles.some(x=>x.code.toLowerCase()===code.toLowerCase()&&x.id!==a?.id))return toast('Este código já está cadastrado');let obj={title,code,category:$('editCategory').value,tags:$('editTags').value.split(',').map(x=>x.trim()).filter(Boolean),summary:$('editSummary').value.trim(),content:safe($('editBody').innerHTML),updated:now()};if(a){a.history=a.history||[];a.history.push({date:a.updated,author:user.name,content:a.content,title:a.title});Object.assign(a,obj)}else{a=Object.assign({id:'local-'+Date.now(),author:user.name,created:now(),views:0,comments:[],history:[]},obj);data.articles.unshift(a)}saveData();toast('Conteúdo publicado com sucesso');openArticle(a.id)}}
function exportData(){downloadText('base190-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json')}
function importData(e){let f=e.target.files[0];if(!f)return;f.text().then(s=>{try{let parsed=JSON.parse(s);if(!parsed||!Array.isArray(parsed.articles)||!parsed.articles.every(a=>a&&typeof a.title==='string'&&typeof a.code==='string'&&typeof a.content==='string'))throw Error('invalid');if(!confirm('Substituir a base local pelo backup selecionado?'))return;data={articles:parsed.articles.map(a=>({...a,content:safe(a.content),comments:Array.isArray(a.comments)?a.comments:[],history:Array.isArray(a.history)?a.history:[],tags:Array.isArray(a.tags)?a.tags:[]})),favorites:Array.isArray(parsed.favorites)?parsed.favorites:[],recent:[],settings:data.settings};saveData();manage();toast('Backup importado')}catch(e){toast('Arquivo JSON inválido')}})}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'&&user){e.preventDefault();query='';category='Todas';go('search');setTimeout(()=>$('searchInput')?.focus(),0)}if(e.key==='Escape'&&$('sidebar'))$('sidebar').classList.remove('open')});
render();
})();
</script></body></html>

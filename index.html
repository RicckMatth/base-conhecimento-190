<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base de Conhecimento 190</title><style>body{margin:0;background:#f4f6fa;color:#172b4d;font:15px Arial}header{background:#fff;border-bottom:1px solid #ddd;padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}input,select,textarea{padding:10px;border:1px solid #ccd4e0;border-radius:5px}button{padding:10px;border:0;border-radius:5px;background:#0757bf;color:white;cursor:pointer;margin:3px}aside{background:#eaf0f8;padding:20px}main{padding:24px;max-width:1000px}.layout{display:grid;grid-template-columns:240px 1fr}.card{background:white;border:1px solid #e0e5ef;padding:24px;margin-bottom:16px;border-radius:10px}.item{padding:15px;border-bottom:1px solid #eee;cursor:pointer}.item:hover{background:#f3f6fa}.muted{color:#63748d}.tag{background:#e5edfa;border-radius:20px;padding:4px 8px;margin:3px;display:inline-block}#editor{border:1px solid #ccd4e0;min-height:240px;padding:15px;background:white}dialog{border:0;border-radius:10px;width:min(90vw,760px)}article{line-height:1.7}#q{flex:1;min-width:170px}@media(max-width:700px){.layout{display:block}aside{padding:10px}main{padding:12px}}</style><header><b>📚 Base de Conhecimento 190</b><input id="q" placeholder='Pesquisar palavras ou "frases exatas"'><select id="user"></select><span id="profile"></span></header><div class="layout"><aside><h3>Espaços</h3><div id="spaces"></div><button onclick="home()">Início</button><button onclick="exportJSON()">Exportar JSON</button><p class="muted">Protótipo local: sem autenticação real.</p></aside><main id="main"></main></div><dialog id="dialog"><h2>Editor de páginas</h2><input id="title" placeholder="Título" style="width:95%"><p><select id="space"></select><input id="tags" placeholder="Tags separadas por vírgula"></p><p><button onclick="document.execCommand('bold')">Negrito</button><button onclick="document.execCommand('italic')">Itálico</button><button onclick="document.execCommand('insertUnorderedList')">Lista</button><button onclick="document.execCommand('formatBlock',false,'h2')">Título</button></p><div id="editor" contenteditable="true"></div><p><button onclick="save()">Publicar</button><button onclick="dialog.close()">Cancelar</button></p></dialog><script>
const KEY='base190-v1',people=[{id:'admin',name:'Administrador',type:'Militar',admin:true},{id:'operador',name:'Operador',type:'Militar',admin:false},{id:'civil',name:'Colaborador',type:'Civil',admin:false}],initial=[{id:'1',title:'Introdução à Base 190',space:'Geral',tags:['manual'],content:'<h2>Boas-vindas</h2><p>Base de conhecimento para pesquisa, consulta e documentação. Este texto é fictício.</p>',author:'admin',date:new Date().toISOString(),comments:[],history:[]},{id:'2',title:'Pesquisa de palavras',space:'Treinamento',tags:['pesquisa'],content:'<h2>Como pesquisar</h2><p>Digite uma palavra exata ou uma frase entre aspas para localizar o conteúdo.</p>',author:'admin',date:new Date().toISOString(),comments:[],history:[]}];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.pages))state={pages:initial,user:'admin'};let selected=null,editing=null;const el=id=>document.getElementById(id),person=()=>people.find(p=>p.id===state.user),persist=()=>localStorage.setItem(KEY,JSON.stringify(state)),escapeHTML=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),plain=s=>{let d=document.createElement('div');d.innerHTML=s;return d.textContent||''},clean=s=>{let d=new DOMParser().parseFromString(s,'text/html');d.querySelectorAll('script,iframe,object,style,svg').forEach(n=>n.remove());d.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{if(a.name.startsWith('on')||a.name==='style'||(a.name==='href'&&!a.value.startsWith('https://')))n.removeAttribute(a.name)}));return d.body.innerHTML};
function setup(){user.innerHTML=people.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('');user.value=state.user;user.onchange=()=>{state.user=user.value;persist();home()};q.oninput=search;home()}
function navigation(){profile.textContent=person().type+' · '+(person().admin?'Admin':'Leitor');let names=[...new Set(['Geral','Treinamento',...state.pages.map(p=>p.space)])];spaces.innerHTML=names.map(n=>'<button data-space="'+escapeHTML(n)+'">'+escapeHTML(n)+'</button>').join('');spaces.querySelectorAll('button').forEach(b=>b.onclick=()=>listing(state.pages.filter(p=>p.space===b.dataset.space),b.dataset.space));space.innerHTML=names.map(n=>'<option>'+escapeHTML(n)+'</option>').join('')}
function listing(pages,heading){main.innerHTML='<div class="card"><h1>'+escapeHTML(heading)+'</h1>'+(person().admin?'<button onclick="edit()">+ Nova página</button>':'')+'</div><div class="card">'+(pages.length?pages.map(p=>'<div class="item" data-id="'+escapeHTML(p.id)+'"><b>'+escapeHTML(p.title)+'</b><p class="muted">'+escapeHTML(p.space)+' · '+escapeHTML(p.author)+' · '+new Date(p.date).toLocaleDateString('pt-BR')+'</p>'+p.tags.map(t=>'<span class="tag">'+escapeHTML(t)+'</span>').join('')+'</div>').join(''):'Nenhum resultado')+'</div>';main.querySelectorAll('[data-id]').forEach(n=>n.onclick=()=>show(n.dataset.id))}
function home(){navigation();listing(state.pages,'Páginas da Base 190')}
function show(id){selected=id;let p=state.pages.find(p=>p.id===id);if(!p)return home();main.innerHTML='<div class="card"><p class="muted">'+escapeHTML(p.space)+'</p><h1>'+escapeHTML(p.title)+'</h1><p class="muted">Criador: '+escapeHTML(p.author)+' · '+new Date(p.date).toLocaleString('pt-BR')+'</p>'+p.tags.map(t=>'<span class="tag">'+escapeHTML(t)+'</span>').join('')+'<p>'+(person().admin?'<button onclick="edit(selected)">Editar</button><button onclick="removePage()">Excluir</button>':'')+'</p><article>'+clean(p.content)+'</article></div><div class="card"><h2>Comentários</h2>'+p.comments.map(c=>'<p><b>'+escapeHTML(c.author)+'</b>: '+escapeHTML(c.text)+'</p>').join('')+'<textarea id="comment" placeholder="Comentário com @menções" style="width:95%"></textarea><p><button onclick="comment()">Comentar</button></p><p class="muted">Versões anteriores: '+p.history.length+'</p></div>'}
function edit(id){if(!person().admin)return;editing=id||null;let p=state.pages.find(p=>p.id===id);title.value=p?.title||'';space.value=p?.space||'Geral';tags.value=p?.tags.join(', ')||'';editor.innerHTML=p?clean(p.content):'<p>Escreva aqui...</p>';dialog.showModal()}
function save(){if(!person().admin)return;let name=title.value.trim();if(!name)return alert('Informe um título');let p=state.pages.find(p=>p.id===editing);if(p){p.history.push({date:p.date,content:p.content});Object.assign(p,{title:name,space:space.value,tags:tags.value.split(',').map(t=>t.trim()).filter(Boolean),content:clean(editor.innerHTML),date:new Date().toISOString()})}else{p={id:String(Date.now()),title:name,space:space.value,tags:tags.value.split(',').map(t=>t.trim()).filter(Boolean),content:clean(editor.innerHTML),date:new Date().toISOString(),author:state.user,comments:[],history:[]};state.pages.push(p)}persist();dialog.close();home();show(p.id)}
function removePage(){if(!person().admin||!confirm('Excluir página?'))return;state.pages=state.pages.filter(p=>p.id!==selected);persist();home()}
function comment(){let p=state.pages.find(p=>p.id===selected),t=el('comment').value.trim();if(!t)return;p.comments.push({author:state.user,text:t});persist();show(selected)}
function search(){let value=q.value.trim();if(!value)return home();navigation();let parts=[...value.matchAll(/"([^"]+)"|(\S+)/g)].map(m=>m[1]||m[2]);let norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();listing(state.pages.filter(p=>{let text=norm([p.title,p.space,p.tags.join(' '),plain(p.content),p.author,p.comments.map(c=>c.text).join(' ')].join(' '));return parts.every(term=>{let t=norm(term),at=text.indexOf(t);while(at>=0){let before=text[at-1]||' ',after=text[at+t.length]||' ';if(!/[a-z0-9]/i.test(before)&&!/[a-z0-9]/i.test(after))return true;at=text.indexOf(t,at+1)}return false})}),'Resultados para: '+value)}
function exportJSON(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download='base-190.json';a.click();URL.revokeObjectURL(url)}setup();</script></html>
